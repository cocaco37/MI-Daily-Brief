<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MI Daily Brief</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --ink:#13222C; --ink-2:#4A5A66; --ink-3:#7A8894;
  --line:#D9E0E5; --accent:#1B5C85; --accent-soft:#E3EEF5;
  --up:#B42318; --down:#1D6FB8; --flat:#5E6B75;
  --tag-ok-bg:#E4F2EA; --tag-ok:#1E6B45;
  --tag-ev-bg:#E6EEF8; --tag-ev:#1D4F8A;
  --tag-hold-bg:#F1EFEA; --tag-hold:#6B5D3F;
  --warn-bg:#FFF4E5; --warn:#8A4B08;
  --kakao:#FEE500; --kakao-ink:#191600;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E171D; --surface:#15222B; --ink:#E4EBF0; --ink-2:#A9B7C1; --ink-3:#7D8C97;
    --line:#26363F; --accent:#7DB8DE; --accent-soft:#18303F;
    --up:#F2877C; --down:#79B3EA; --flat:#9AA8B2;
    --tag-ok-bg:#153227; --tag-ok:#86D1A8;
    --tag-ev-bg:#172C44; --tag-ev:#9CC2EE;
    --tag-hold-bg:#2A261D; --tag-hold:#D2C29C;
    --warn-bg:#2E2213; --warn:#F0B56A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E171D; --surface:#15222B; --ink:#E4EBF0; --ink-2:#A9B7C1; --ink-3:#7D8C97;
  --line:#26363F; --accent:#7DB8DE; --accent-soft:#18303F;
  --up:#F2877C; --down:#79B3EA; --flat:#9AA8B2;
  --tag-ok-bg:#153227; --tag-ok:#86D1A8;
  --tag-ev-bg:#172C44; --tag-ev:#9CC2EE;
  --tag-hold-bg:#2A261D; --tag-hold:#D2C29C;
  --warn-bg:#2E2213; --warn:#F0B56A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.head{display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;letter-spacing:.06em;color:var(--ink-2);font-weight:500}
.sample{background:var(--warn-bg);color:var(--warn);padding:2px 8px;border-radius:3px;font-weight:600;letter-spacing:.02em}
h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px;color:var(--ink-2)}
.meta dt{color:var(--ink-3)}
.meta dd{margin:0}

/* sections */
section{display:flex;flex-direction:column;gap:14px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec-title h2{font-size:17px;font-weight:700}
.sec-title span{font-size:12px;color:var(--ink-3)}

/* kakao */
.kakao{display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--kakao);color:var(--kakao-ink);border-radius:4px 14px 14px 14px;padding:12px 14px;max-width:340px;font-size:13.5px;line-height:1.6;white-space:pre-line}
.bubble b{font-weight:700}
.note{font-size:12.5px;color:var(--ink-3)}

/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;background:var(--accent-soft)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.idx-note{font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

.alert{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 14px;font-size:13.5px}
.alert b{font-weight:700}

/* items */
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.item-head{display:flex;flex-direction:column;gap:6px}
.cat{font-size:11.5px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.item h3{font-size:16.5px;font-weight:700}
.rows{display:grid;grid-template-columns:88px 1fr;gap:10px 14px;margin:0}
.rows dt{font-size:12.5px;font-weight:600;color:var(--ink-3);padding-top:2px}
.rows dd{margin:0;font-size:14.5px}
.rows ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.src{font-size:13px;color:var(--ink-2)}
.src a{word-break:break-word}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:3px;margin-right:6px;letter-spacing:.02em;vertical-align:1px}
.t-ok{background:var(--tag-ok-bg);color:var(--tag-ok)}
.t-ev{background:var(--tag-ev-bg);color:var(--tag-ev)}
.t-hold{background:var(--tag-hold-bg);color:var(--tag-hold)}
.t-single{background:var(--warn-bg);color:var(--warn)}
.t-rep{background:var(--line);color:var(--ink-2)}

/* watch / schedule / excluded */
.plain{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.plain ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.sched{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}
.sched dt{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:500;white-space:nowrap}
.sched dd{margin:0}
.excl li{color:var(--ink-2)}
.excl b{color:var(--ink)}

.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.sources ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.sources a{word-break:break-all}

@media (max-width:520px){
  h1{font-size:23px}
  .rows{grid-template-columns:1fr;gap:2px}
  .rows dd{margin-bottom:8px}
}
/* transmission chain */
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.chain li{position:relative;padding:0 0 10px 22px;font-size:14px}
.chain li::before{content:"";position:absolute;left:5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.chain li::after{content:"";position:absolute;left:8.5px;top:18px;bottom:-2px;width:1px;background:var(--line)}
.chain li:last-child{padding-bottom:0}
.chain li:last-child::after{display:none}
.chain li.ok::before{background:var(--tag-ok)}
.chain li.open::before{background:transparent;border:1.5px solid var(--ink-3)}
.chain .st{font-size:11.5px;font-weight:600;margin-left:6px;color:var(--ink-3)}
.chain li.ok .st{color:var(--tag-ok)}
.time{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px}
.summary ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.summary li{color:var(--ink-2);font-size:14px}
.summary li b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.baseline{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:4px;padding:8px 12px}
</style>
